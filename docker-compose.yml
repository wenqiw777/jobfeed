services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobfeed
      POSTGRES_PASSWORD: jobfeed_dev
      POSTGRES_DB: jobfeed_dev
    ports:
      - "${JOBFEED_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfeed"]
      interval: 5s
      timeout: 3s
      retries: 5

  jobfeed-cli:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      JOBFEED_DB_URL: "postgresql://jobfeed:jobfeed_dev@postgres:5432/jobfeed_dev"
      # Persist the fastembed ONNX weight cache on the mlcache named volume below
      # so the ~90MB MiniLM download is one-time per machine, not per `--rm` run
      # (and offline reruns work). Must match the mlcache mount target.
      JOBFEED_ML_CACHE_DIR: "/cache/jobfeed/fastembed"
      # Forward host LLM API keys into the container so the openai-compat
      # backend works through the canonical ./bin/jobfeed (docker compose run)
      # path, not only the host venv. Only the documented providers
      # (openai_compat_api_key_env in config.example.toml) are forwarded; add a
      # line here for any custom key env name. Default-empty so compose never
      # warns on unused providers — _require_api_key() then fails fast with its
      # teaching message when the configured key is unset.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # Named volume for the fastembed ONNX weights; survives `docker compose run
      # --rm`, so the model is downloaded once and reused on every later run.
      - mlcache:/cache/jobfeed/fastembed
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mlcache:
