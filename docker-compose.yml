services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobfeed
      POSTGRES_PASSWORD: jobfeed_dev
      POSTGRES_DB: jobfeed_dev
    ports:
      - "${JOBFEED_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfeed"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger

  jobfeed-cli:
    # Prebuilt image published to GHCR on release (see
    # .github/workflows/publish-image.yml). `docker compose pull jobfeed-cli`
    # fetches it so a fresh machine needs no local build; `build:` stays as the
    # fallback for local development / commits newer than the published image.
    image: ${JOBFEED_IMAGE:-ghcr.io/wenqiw777/jobfeed:latest}
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      JOBFEED_DB_URL: "postgresql://jobfeed:jobfeed_dev@postgres:5432/jobfeed_dev"
      JOBFEED_MIGRATION_PG_URL: "${JOBFEED_MIGRATION_PG_URL:-}"
      JOBFEED_MIGRATION_SCRATCH_PG_URL: "${JOBFEED_MIGRATION_SCRATCH_PG_URL:-}"
      JOBFEED_BENCH_MACHINE_TOKEN: "${JOBFEED_BENCH_MACHINE_TOKEN:-}"
      JOBFEED_MIGRATION_GIT_COMMIT: "${JOBFEED_MIGRATION_GIT_COMMIT:-}"
      JOBFEED_MIGRATION_TIMEOUT_SECONDS: "${JOBFEED_MIGRATION_TIMEOUT_SECONDS:-1800}"
      # Resolve the fastembed ONNX weight cache to the path the image BAKES the
      # weights into at build time, so the canonical `docker compose run --rm`
      # path does zero runtime download and works offline. Reasserts the
      # Dockerfile's image-level default (kept identical) and must match the
      # mlcache mount target below.
      JOBFEED_ML_CACHE_DIR: "/cache/jobfeed/fastembed"
      # Forward host LLM API keys into the container so the openai-compat
      # backend works through the canonical ./bin/jobfeed (docker compose run)
      # path, not only the host venv. Only the documented providers
      # (openai_compat_api_key_env in config.example.toml) are forwarded; add a
      # line here for any custom key env name, or configure
      # openai_compat_api_key_env="JOBFEED_OPENAI_COMPAT_API_KEY" and set that
      # generic host env var. Default-empty so compose never warns on unused
      # providers — _require_api_key() then fails fast with its teaching message
      # when the configured key is unset.
      JOBFEED_OPENAI_COMPAT_API_KEY: "${JOBFEED_OPENAI_COMPAT_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # Named volume for the fastembed ONNX weights. A FRESH mlcache is seeded
      # from the image's baked weights at this path on first mount, so runs work
      # offline out of the box; the volume then persists them across `--rm`.
      # Upgraders with a pre-existing EMPTY mlcache (from before the bake) run
      # `docker volume rm jobfeed_mlcache` once so it re-seeds from the new image.
      - mlcache:/cache/jobfeed/fastembed
    depends_on:
      postgres:
        condition: service_healthy

  restore-source:
    image: postgres:16
    profiles: ["migration"]
    environment:
      POSTGRES_USER: jobfeed
      POSTGRES_DB: jobfeed_restore
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - restore_source_data:/var/lib/postgresql/data
    networks: ["migration-internal"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfeed -d jobfeed_restore"]
      interval: 2s
      timeout: 3s
      retries: 30

  restore-scratch:
    image: postgres:16
    profiles: ["migration"]
    environment:
      POSTGRES_USER: jobfeed
      POSTGRES_DB: jobfeed_restore
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - restore_scratch_data:/var/lib/postgresql/data
    networks: ["migration-internal"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfeed -d jobfeed_restore"]
      interval: 2s
      timeout: 3s
      retries: 30

  migration-runner:
    image: ${JOBFEED_MIGRATION_IMAGE:-jobfeed-migration:local}
    build:
      context: .
      dockerfile: Dockerfile.migration
    profiles: ["migration"]
    working_dir: /app
    environment:
      JOBFEED_MIGRATION_PG_URL: "postgresql://jobfeed@restore-source:5432/jobfeed_restore"
      JOBFEED_MIGRATION_SCRATCH_PG_URL: "postgresql://jobfeed@restore-scratch:5432/jobfeed_restore"
      JOBFEED_BENCH_MACHINE_TOKEN: "${JOBFEED_BENCH_MACHINE_TOKEN:-}"
      JOBFEED_MIGRATION_GIT_COMMIT: "${JOBFEED_MIGRATION_GIT_COMMIT:-}"
      JOBFEED_MIGRATION_TIMEOUT_SECONDS: "${JOBFEED_MIGRATION_TIMEOUT_SECONDS:-1800}"
    volumes:
      - type: bind
        source: ${JOBFEED_MIGRATION_DUMP_HOST:-/dev/null}
        target: /run/jobfeed-migration/source.dump
        read_only: true
      - type: bind
        source: ${JOBFEED_MIGRATION_ARTIFACT_PARENT_HOST:-.}
        target: /migration/artifacts
      - type: bind
        source: ${JOBFEED_MIGRATION_RUN_HOST:-.}
        target: /run/jobfeed-migration
    networks: ["migration-internal"]
    depends_on:
      restore-source:
        condition: service_healthy
      restore-scratch:
        condition: service_healthy

networks:
  migration-internal:
    internal: true

volumes:
  pgdata:
  mlcache:
  jaeger_data:
  restore_source_data:
  restore_scratch_data:
