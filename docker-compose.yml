services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobfeed
      POSTGRES_PASSWORD: jobfeed_dev
      POSTGRES_DB: jobfeed_dev
    ports:
      - "${JOBFEED_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfeed"]
      interval: 5s
      timeout: 3s
      retries: 5

  jobfeed-cli:
    # Prebuilt image published to GHCR on release (see
    # .github/workflows/publish-image.yml). `docker compose pull jobfeed-cli`
    # fetches it so a fresh machine needs no local build; `build:` stays as the
    # fallback for local development / commits newer than the published image.
    image: ${JOBFEED_IMAGE:-ghcr.io/wenqiw777/jobfeed:latest}
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      JOBFEED_DB_URL: "postgresql://jobfeed:jobfeed_dev@postgres:5432/jobfeed_dev"
      # Resolve the fastembed ONNX weight cache to the path the image BAKES the
      # weights into at build time, so the canonical `docker compose run --rm`
      # path does zero runtime download and works offline. Reasserts the
      # Dockerfile's image-level default (kept identical) and must match the
      # mlcache mount target below.
      JOBFEED_ML_CACHE_DIR: "/cache/jobfeed/fastembed"
      # Forward host LLM API keys into the container so the openai-compat
      # backend works through the canonical ./bin/jobfeed (docker compose run)
      # path, not only the host venv. Only the documented providers
      # (openai_compat_api_key_env in config.example.toml) are forwarded; add a
      # line here for any custom key env name, or configure
      # openai_compat_api_key_env="JOBFEED_OPENAI_COMPAT_API_KEY" and set that
      # generic host env var. Default-empty so compose never warns on unused
      # providers — _require_api_key() then fails fast with its teaching message
      # when the configured key is unset.
      JOBFEED_OPENAI_COMPAT_API_KEY: "${JOBFEED_OPENAI_COMPAT_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # Named volume for the fastembed ONNX weights. A FRESH mlcache is seeded
      # from the image's baked weights at this path on first mount, so runs work
      # offline out of the box; the volume then persists them across `--rm`.
      # Upgraders with a pre-existing EMPTY mlcache (from before the bake) run
      # `docker volume rm jobfeed_mlcache` once so it re-seeds from the new image.
      - mlcache:/cache/jobfeed/fastembed
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mlcache:
