services:
  redis:
    image: redis:8.2.9
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --maxmemory, 512mb, --maxmemory-policy, noeviction]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redis-data:
