[db]
# PostgreSQL DSN. Omit to use the CLI's built-in development DSN, or override
# at runtime with JOBFEED_DB_URL / JOBFEED_DB__URL.
url = "postgresql://jobfeed:jobfeed_dev@localhost:5432/jobfeed_dev"

[llm]
stage_a = "codex-cli/gpt-5.4-mini"         # or "claude-cli/claude-haiku-4-5", "mock/stage-a"
stage_b = "codex-cli/gpt-5.5"              # or "claude-cli/claude-sonnet-4-6", "mock/stage-b"
codex_timeout_s = 60
claude_timeout_s = 210
max_daily_score_calls = 150
max_daily_cost_usd = 10.0
max_concurrent = 4
master_resume_path = ".jobfeed-dev/resume.md"
# preamble_personal_path = ".jobfeed-dev/preamble_personal.md"

[scoring]
stage_a_threshold = 60

[execution]
default_runner = "in_process"

[observability]
log_level = "info"
log_format = "human"

[sources.ats]
enabled = true
max_concurrent = 10
probe_ttl_days = 7
failure_threshold = 3
seed_companies = ["anthropic", "openai", "palantir"]

# NOTE: list fields below (e.g. search_urls) are TOML-only. They cannot be set
# via JOBFEED_SOURCES__*__SEARCH_URLS env vars: the nested-env setter stores a
# bare string at the leaf, which Pydantic will not coerce into a list.

[sources.speedyapply]
enabled = false
# search_urls = []          # empty selects the built-in default README
# max_concurrent = 10
# fetch_timeout_s = 30.0

[sources.indeed]
enabled = false
# search_urls = []
# max_jobs = 100
# hours_old =               # unset; when set, overrides each URL's fromage window

[sources.linkedin_jobspy]
enabled = false
# search_urls = []
# max_jobs = 100
# hours_old =               # unset; when set, overrides each URL's fromage window

# LinkedIn JobSpy and LinkedIn Playwright are alternative LinkedIn paths; pick
# at most one for routine scans to avoid duplicate LinkedIn traffic.
[sources.linkedin]
enabled = false
