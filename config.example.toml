#   "https://www.linkedin.com/jobs/search/?keywords=software%20engineer%20intern",
#   { url = "https://www.linkedin.com/jobs/search/?keywords=fall%202026%20intern", max_jobs = 25, group = "fall", group_max_jobs = 10 },
