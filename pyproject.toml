[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfeed"
version = "0.1.0"
description = "Local-first job scanning and evaluation pipeline."
requires-python = ">=3.11"
dependencies = [
    "alembic >= 1.15",
    "asyncpg >= 0.30",
    "beautifulsoup4 >= 4.12",
    "click",
    "httpx >= 0.28",
    "jinja2 >= 3.1",
    "psycopg2-binary >= 2.9",
    "pydantic",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "respx >= 0.22",
    "ruff",
    "testcontainers[postgres] >= 4.0",
]

[project.scripts]
jobfeed = "jobfeed.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "C901", "RET", "ARG", "PL", "RUF"]
ignore = ["PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"src/jobfeed/ports/*.py" = ["ARG002", "PLR0913"]
"src/jobfeed/adapters/store/postgres.py" = ["ARG002", "E501", "PLR0913", "SIM117"]
"tests/**/test_ports.py" = ["ARG002", "PLR0913"]
"tests/conftest.py" = ["PLC0415"]
"tests/fixtures/generate_legacy_fixture.py" = ["PLR2004", "E501", "C901", "PLC0415"]
"migrations/env.py" = ["PLC0415"]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "postgres: requires PostgreSQL (Docker)",
    "live: requires real HTTP to external APIs (manual only)",
]
addopts = "-m 'not postgres and not live'"
