[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfeed"
version = "0.1.0"
description = "Local-first job scanning and evaluation pipeline."
requires-python = ">=3.11"
dependencies = [
    "alembic >= 1.15",
    "asyncpg >= 0.30",
    "beautifulsoup4 >= 4.12",
    "click",
    "httpx >= 0.28",
    "jinja2 >= 3.1",
    # OpenAI SDK drives the `openai-compat` LLM backend (Decision 9). Lazy-imported
    # inside the factory branch + under TYPE_CHECKING in the adapter, so the rest
    # of the package imports cleanly even when the SDK is absent.
    # >= 1.57.1: first release compatible with httpx 0.28 (which dropped the
    # `proxies` kwarg). Older SDKs pass `proxies` and crash constructing
    # AsyncOpenAI under our httpx floor — see openai-python#1902. The floor keeps
    # locked/constrained installs reproducible, not just fresh latest-resolves.
    "openai >= 1.57.1",
    "psycopg2-binary >= 2.9",
    "pydantic",
    "playwright >= 1.48",
    # >= 1.1.82: the version we validate against; older 1.1.x predates the
    # country_indeed / linkedin_fetch_description kwargs _jobspy.scrape passes,
    # which would otherwise raise (contained as JobSpyError -> silent 0 jobs).
    "python-jobspy >= 1.1.82",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-playwright",
    "respx >= 0.22",
    "ruff",
    "testcontainers[postgres] >= 4.0",
]

[project.scripts]
jobfeed = "jobfeed.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "C901", "RET", "ARG", "PL", "RUF"]
ignore = ["PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"src/jobfeed/ports/*.py" = ["ARG002", "PLR0913"]
"src/jobfeed/adapters/store/postgres.py" = ["ARG002", "E501", "PLR0913", "SIM117"]
"tests/**/test_ports.py" = ["ARG002", "PLR0913"]
# The dedupe tests build JobPosting fixtures via a keyword-only `_job` helper
# that exposes every dedup-relevant field (>5 kwargs) so each test can pin one
# decisive key; that is the point of the helper, not accidental sprawl.
"tests/unit/test_dedupe.py" = ["PLR0913"]
"tests/contract/test_dedupe_contract.py" = ["PLR0913"]
"tests/conftest.py" = ["PLC0415"]
# SpeedyApply markdown-table fixtures embed HTML anchors that are inherently
# wider than 88 chars; the table rows cannot be wrapped without corrupting the
# fixture. E501 stays active everywhere else.
"tests/unit/test_speedyapply_markdown.py" = ["E501"]
"tests/unit/test_speedyapply_routing.py" = ["E501"]
"tests/fixtures/generate_legacy_fixture.py" = ["PLR2004", "E501", "C901", "PLC0415"]
"migrations/env.py" = ["PLC0415"]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
mypy_path = "src"

# jobspy and pandas ship no type stubs / py.typed marker. They are confined to
# the JobSpy isolation boundary (adapters/sources/_jobspy*.py); treat their
# imports as untyped rather than failing strict mode.
[[tool.mypy.overrides]]
module = ["jobspy.*", "pandas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "postgres: requires PostgreSQL (Docker)",
    "live: requires real HTTP to external APIs (manual only)",
    "browser: requires Playwright browser binaries",
]
addopts = "-m 'not postgres and not live and not browser'"
