[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfeed"
version = "0.1.0"
description = "Local-first job scanning and evaluation pipeline."
requires-python = ">=3.11"
dependencies = [
    "aiosqlite",
    "click",
    "pydantic",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
jobfeed = "jobfeed.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "C901", "RET", "ARG", "PL", "RUF"]
ignore = ["PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"src/jobfeed/ports/*.py" = ["ARG002", "PLR0913"]
"src/jobfeed/adapters/store/sqlite.py" = ["ARG002", "E501", "PLR0913"]
"src/jobfeed/adapters/store/_sqlite_*.py" = ["PLR0913"]
"tests/**/test_ports.py" = ["ARG002", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
