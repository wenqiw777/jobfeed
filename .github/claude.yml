# Claude GitHub App — automatic PR review configuration
# Requires: install the Claude app at github.com/apps/claude

# Automatically review every PR on open and update
auto_review:
  enabled: true
  triggers:
    - pull_request.opened
    - pull_request.synchronize

# Review instructions
review:
  prompt: |
    Review this PR against the project's engineering standards.
    Focus on:
    - Architecture boundary violations (domain imports external libs, services import adapters)
    - Code hygiene (bare except, nesting depth, file length >300 lines)
    - Correctness bugs and unhandled edge cases
    - Naming convention violations

    Reference docs/engineering-standards.md for the full ruleset.
    Be concise.