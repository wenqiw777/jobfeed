name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run quality gate (lint + unit/contract tests, no PG)
        run: make quality

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobfeed
          POSTGRES_PASSWORD: jobfeed
          POSTGRES_DB: jobfeed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfeed"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run PostgreSQL-backed tests
        env:
          PGTEST_DSN: "postgresql://jobfeed:jobfeed@localhost:5432/jobfeed_test"
          PGTEST_REQUIRE: "1"
        run: pytest -m postgres -o "addopts=" -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build jobfeed CLI image
        run: docker compose build jobfeed-cli

      - name: Verify CLI help
        run: docker compose run --rm jobfeed-cli jobfeed --help
