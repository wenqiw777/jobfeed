name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build jobfeed CLI image
        run: docker compose build jobfeed-cli

      - name: Run quality gate
        run: docker compose run --rm jobfeed-cli make quality

      - name: Verify CLI help
        run: docker compose run --rm jobfeed-cli jobfeed --help

      - name: Run Dockerized CLI smoke
        run: |
          rm -rf .jobfeed-dev
          ./bin/jobfeed scan --source mock
          ./bin/jobfeed evaluate
          ./bin/jobfeed digest
